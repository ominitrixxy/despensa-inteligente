name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: despensa
          POSTGRES_PASSWORD: despensa
          POSTGRES_DB: despensa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U despensa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://despensa:despensa@localhost:5432/despensa_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      RUN_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @despensa/api prisma:generate
      # Troque por `prisma migrate deploy` depois de commitar a pasta apps/api/prisma/migrations
      - run: pnpm --filter @despensa/api exec prisma db push --skip-generate
      - run: pnpm --filter @despensa/api build
      - run: pnpm --filter @despensa/api test
      - run: pnpm --filter @despensa/api test:e2e
